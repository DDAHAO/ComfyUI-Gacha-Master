[project]
name = "comfyui-gacha-master"
version = "1.0.0"
description = "Controlled, resumable multi-image gacha runs for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "License not selected; see LICENSE-NOTICE.md" }
dependencies = []

[project.urls]
Homepage = "https://github.com/DDAHAO/ComfyUI-Gacha-Master"
Repository = "https://github.com/DDAHAO/ComfyUI-Gacha-Master"
Issues = "https://github.com/DDAHAO/ComfyUI-Gacha-Master/issues"

[project.optional-dependencies]
# Only for the standalone L0 test suite; ComfyUI already provides Pillow/aiohttp.
test = ["Pillow>=10.1.0", "aiohttp>=3.11.8"]

[tool.setuptools]
packages = ["comfyui_gacha_master"]

[tool.black]
line-length = 110
